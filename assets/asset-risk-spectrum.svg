<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="760" height="290" fill="#ffffff"/>
  <text x="40" y="40" font-size="22" font-weight="700" fill="#1f2a44">资产风险光谱：从稳到猛</text>

  <defs>
    <linearGradient id="riskGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4e79a7"/>
      <stop offset="25%" stop-color="#59a14f"/>
      <stop offset="50%" stop-color="#edc948"/>
      <stop offset="75%" stop-color="#f28e2b"/>
      <stop offset="100%" stop-color="#e15759"/>
    </linearGradient>
  </defs>

  <!-- 渐变风险条 -->
  <rect x="50" y="64" width="660" height="22" rx="11" fill="url(#riskGrad)"/>
  <text x="50" y="104" font-size="12" fill="#6b7280">稳 · 低风险 · 高流动</text>
  <text x="710" y="104" text-anchor="end" font-size="12" fill="#6b7280">猛 · 高风险 · 可能归零</text>

  <!-- 悬挂的卡片：现金/货基 -->
  <line x1="105" y1="86" x2="105" y2="110" stroke="#4e79a7" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="60" y="110" width="90" height="92" rx="10" fill="#eff6ff" stroke="#4e79a7" stroke-width="1.5"/>
  <text x="105" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a44">现金/货基</text>
  <text x="105" y="156" text-anchor="middle" font-size="10" fill="#6b7280">流动性最高</text>
  <text x="105" y="174" text-anchor="middle" font-size="10" fill="#6b7280">收益≈跑输通胀</text>

  <!-- 债券/固收 -->
  <line x1="215" y1="86" x2="215" y2="110" stroke="#59a14f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="170" y="110" width="90" height="92" rx="10" fill="#f0fdf4" stroke="#59a14f" stroke-width="1.5"/>
  <text x="215" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a44">债券/固收</text>
  <text x="215" y="156" text-anchor="middle" font-size="10" fill="#6b7280">稳钱主力</text>
  <text x="215" y="174" text-anchor="middle" font-size="10" fill="#6b7280">利率/信用风险</text>

  <!-- 宽基指数 -->
  <line x1="325" y1="86" x2="325" y2="110" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="280" y="110" width="90" height="92" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="325" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a44">宽基指数</text>
  <text x="325" y="156" text-anchor="middle" font-size="10" fill="#6b7280">长钱复利</text>
  <text x="325" y="174" text-anchor="middle" font-size="10" fill="#6b7280">年化波动 15–25%</text>

  <!-- 行业/主动基金 -->
  <line x1="435" y1="86" x2="435" y2="110" stroke="#f28e2b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="390" y="110" width="90" height="92" rx="10" fill="#fff7ed" stroke="#f28e2b" stroke-width="1.5"/>
  <text x="435" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a44">行业/主动</text>
  <text x="435" y="156" text-anchor="middle" font-size="10" fill="#6b7280">卫星仓位</text>
  <text x="435" y="174" text-anchor="middle" font-size="10" fill="#6b7280">可能腰斩</text>

  <!-- 个股 -->
  <line x1="545" y1="86" x2="545" y2="110" stroke="#e15759" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="500" y="110" width="90" height="92" rx="10" fill="#fef2f2" stroke="#e15759" stroke-width="1.5"/>
  <text x="545" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a44">个股</text>
  <text x="545" y="156" text-anchor="middle" font-size="10" fill="#6b7280">高认知要求</text>
  <text x="545" y="174" text-anchor="middle" font-size="10" fill="#6b7280">可归零</text>

  <!-- 衍生品/加密 -->
  <line x1="655" y1="86" x2="655" y2="110" stroke="#b07aa1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="610" y="110" width="90" height="92" rx="10" fill="#faf5ff" stroke="#b07aa1" stroke-width="1.5"/>
  <text x="655" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2a44">衍生品/加密</text>
  <text x="655" y="156" text-anchor="middle" font-size="10" fill="#6b7280">极高杠杆</text>
  <text x="655" y="174" text-anchor="middle" font-size="10" fill="#6b7280">新手禁区</text>

  <text x="380" y="250" text-anchor="middle" font-size="13" fill="#6b7280">没有“最好”的资产，只有最适合你期限和风险承受力的组合。</text>
</svg>
