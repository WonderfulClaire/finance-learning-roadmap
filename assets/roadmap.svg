  <line x1="802" y1="158" x2="944" y2="158" stroke="#FBC02D" stroke-width="1"/>
  <text x="874" y="184" font-size="12" fill="#333" text-anchor="middle">· 财报三张表</text>
  <text x="874" y="208" font-size="12" fill="#333" text-anchor="middle">· Python 量化初探</text>
  <text x="874" y="232" font-size="12" fill="#333" text-anchor="middle">· 保险与养老</text>
  <text x="874" y="268" font-size="11" fill="#888" text-anchor="middle">目标：守住下限</text>

  <text x="490" y="345" font-size="12" fill="#999" text-anchor="middle">配套 tools/ 五个零依赖 Python 计算器 · 详见 30天打卡计划.md</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#999"/>
    </marker>
